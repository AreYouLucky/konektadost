services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: 'konektadost'
      MYSQL_ROOT_PASSWORD: 'root_secret'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
