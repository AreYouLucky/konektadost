; KonektaDOST PHP settings, loaded after php.ini-production.

; A GeoAgent reply can take up to 150 s (several AI rounds plus analysis tools).
max_execution_time = 180
max_input_time = 180

; Province assessments and PDF/report data are memory-heavy.
memory_limit = 512M

; Admin data entries and imports.
post_max_size = 40M
upload_max_filesize = 40M

expose_php = Off

; Code does not change inside a built image, so OPcache never needs to re-check files.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
